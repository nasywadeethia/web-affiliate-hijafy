<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Engine</title>
  <link rel="stylesheet" href="/src/style/global.css">

  <!-- STYLE UI BIRU PUTIH RAPIH & CENTERED -->
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #eef6ff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1f355b;
    }

    .app {
      width: 90%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0, 80, 160, 0.15);
      text-align: center;
    }

    .header-img {
      width: 180px;
      margin-bottom: 20px;
    }

    .app-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #2f5bb7;
    margin-bottom: 20px;
    text-align: center;
}
    .search-box {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .search-box input {
      width: 180px;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #b4d3f9;
      outline: none;
      font-size: 16px;
      background: #f8fbff;
    }

    .search-box input:focus {
      border-color: #4e91ff;
    }

    .search-btn {
      padding: 12px 20px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 10px;
      border: none;
      background: #4e91ff;
      color: #fff;
      transition: 0.2s;
    }

    .search-btn:hover {
      background: #2c6ce6;
    }

    .result-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .result-card {
      background: #f5f9ff;
      border-radius: 14px;
      padding: 20px;
      text-align: left;
      box-shadow: 0 3px 12px rgba(0, 80, 160, 0.08);
    }

    h3 {
      margin: 0 0 10px;
      font-weight: 700;
      color: #2f5bb7;
    }

    .sub-title {
      font-weight: 600;
      color: #366fc9;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    .infoResult {
      background: #fff;
      display: block;
      border-radius: 10px;
      padding: 8px;
      width: 100%;
      border: 1px solid #c5dbff;
      min-height: 40px;
      font-size: 14px;
    }

    video,
    img {
      border-radius: 10px;
      border: 1px solid #c5dbff;
    }
  </style>

</head>

<body>

  <div class="app">

    <h1 class="app-title">SEARCH ENGINE</h1>

    <div class="search-box">
      <input type="text" id="charInput" placeholder="Ketik huruf atau kata..." maxlength="1" />
      <button class="search-btn" id="searchBtn">🔍</button>
    </div>

    <div class="result-container">
      
      <div class="result-card">
        <h3>📕 Hasil Kata</h3>
        <div id="wordList"></div>
      </div>

      <div class="result-card">
        <h3>📘 Hasil Kalimat</h3>
        <div id="tenseList"></div>
      </div>

      <div class="result-card">
        <h3>📗 Informasi</h3>
        
        <p class="sub-title">📄 Teks</p>
        <p class="infoResult"></p>

        <p class="sub-title">📷 Gambar</p>
        <img class="infoResult" src="" />

        <p class="sub-title">📽️ Video</p>
        <video class="infoResult" width="100%" controls></video>
      </div>

    </div>

  </div>

  <script src="./src/js/data.js"></script>
  <script src="./src/js/index.js"></script>

</body>
</html>
